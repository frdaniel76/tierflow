services:
  tierflow:
    build:
      context: .
    image: tierflow:latest
    environment:
      TIERFLOW_HOST: "0.0.0.0"
      TIERFLOW_PORT: "18800"
      # API keys — set in .env file or pass via environment
      # ANTHROPIC_API_KEY: ""
      # OPENAI_API_KEY: ""
      # OPENROUTER_API_KEY: ""
    env_file:
      - .env
    volumes:
      # Mount config from host (optional — uses built-in defaults if absent)
      - ${TIERFLOW_CONFIG:-./tierflow.config.json}:/app/tierflow.config.json:ro
    ports:
      - "127.0.0.1:18800:18800"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:18800/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
